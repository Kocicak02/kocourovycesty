<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa — Berchtesgadenské Alpy</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{width:100%;height:100%;margin:0}
html,body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#map{position:absolute;inset:0}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.media-popup img{display:block;width:100%;max-width:520px;height:auto;border-radius:3px}
.media-name{margin-top:7px;font-size:12px;color:#555;word-break:break-word}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/track_1.js"></script>
<script src="data/Fotky_podle_casu_2.js"></script>
<script>
const PHOTO_BASE="https://cesty.b-cdn.net/2025_08_Berchtesgaden/FOTO/";
const map=L.map("map",{zoomControl:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

const bounds=L.latLngBounds();

function esc(v){
  return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;");
}
function filename(p){
  if(p && p.filename) return String(p.filename).trim();
  const raw=(p && p.path)||"";
  return String(raw).split(/[\\/]/).pop().trim();
}
function photoUrl(p){
  const f=filename(p);
  return f ? PHOTO_BASE+encodeURIComponent(f) : "";
}

if(typeof json_track_1!=="undefined"){
  const layer=L.geoJSON(json_track_1,{
    style:{color:"#111",weight:4,opacity:.9}
  }).addTo(map);
  const b=layer.getBounds();
  if(b.isValid()) bounds.extend(b);
}

if(typeof json_Fotky_podle_casu_2!=="undefined"){
  const layer=L.geoJSON(json_Fotky_podle_casu_2,{
    pointToLayer:(f,ll)=>L.circleMarker(ll,{
      radius:6,color:"#fff",weight:1.5,fillColor:"#111",fillOpacity:1
    }),
    onEachFeature:(f,l)=>{
      const p=f.properties||{}, name=filename(p), url=photoUrl(p);
      if(!url) return;
      l.bindPopup(
        `<div class="media-popup">
          <a href="${url}" target="_blank" rel="noopener">
            <img src="${url}" alt="${esc(name)}">
          </a>
          <div class="media-name">${esc(name)}</div>
        </div>`,
        {maxWidth:560}
      );
    }
  }).addTo(map);
  const b=layer.getBounds();
  if(b.isValid()) bounds.extend(b);
}

if(bounds.isValid()) map.fitBounds(bounds,{padding:[25,25]});
else map.setView([47.6,13.0],10);
</script>
</body>
</html>
