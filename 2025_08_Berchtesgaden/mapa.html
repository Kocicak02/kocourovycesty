<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}#w{height:100%;display:flex;flex-direction:column}#map{flex:1;min-height:300px}#p{height:190px;border-top:1px solid #d9d5cc;background:white;position:relative}svg{width:100%;height:100%;display:block}.tip{position:absolute;left:12px;top:8px;background:white;border:1px solid #ddd;padding:5px 8px;font-size:12px;pointer-events:none}@media(max-width:700px){#p{height:165px}}</style></head>
<body><div id="w"><div id="map"></div><div id="p"><svg id="svg"></svg><div id="tip" class="tip">Přejeď po profilu</div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/track_1.js"></script><script src="data/Fotky_podle_casu_2.js"></script><script src="data/profile_data.js"></script>
<script>
const map=L.map("map");L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
function firstGlobal(prefix){return Object.keys(window).find(k=>k.startsWith(prefix))}
const tk=window[firstGlobal("json_track_")];let tl=L.geoJSON(tk,{style:{color:"#111",weight:4,opacity:.9}}).addTo(map);map.fitBounds(tl.getBounds(),{padding:[20,20]});
const pk=firstGlobal("json_Fotky_podle_casu_");if(pk){L.geoJSON(window[pk],{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:5,color:"#111",weight:2,fillColor:"#fff",fillOpacity:1}),onEachFeature:(f,l)=>{let p=f.properties||{},fn=p.filename||p.file||p.name;if(fn)l.bindPopup('<img src="https://cesty.b-cdn.net/2025_12_Lyzovani/FOTO/'+encodeURIComponent(fn)+'" style="max-width:280px;max-height:300px">')}}).addTo(map)}
const P=window.PROFILE_DATA||[],svg=document.getElementById("svg"),tip=document.getElementById("tip");let dot;
function draw(){if(!P.length)return;let w=svg.clientWidth,h=svg.clientHeight,p=18,max=P.at(-1)[0],es=P.map(x=>x[1]),mn=Math.min(...es),mx=Math.max(...es),X=d=>p+d/max*(w-2*p),Y=e=>h-p-(e-mn)/Math.max(1,mx-mn)*(h-2*p);svg.innerHTML='<path d="'+P.map((q,i)=>(i?'L':'M')+X(q[0])+' '+Y(q[1])).join(' ')+'" fill="none" stroke="#111" stroke-width="2"/>';for(const b of window.ACTIVITY_BREAKS||[]){let x=X(b);svg.innerHTML+='<line x1="'+x+'" y1="8" x2="'+x+'" y2="'+(h-8)+'" stroke="#999" stroke-dasharray="4 4"/>'}svg.onpointermove=e=>{let r=svg.getBoundingClientRect(),d=Math.max(0,Math.min(max,(e.clientX-r.left-p)/(w-2*p)*max)),lo=0,hi=P.length-1;while(lo<hi){let m=(lo+hi)>>1;P[m][0]<d?lo=m+1:hi=m}let q=P[lo];tip.textContent=q[0].toFixed(1).replace('.',',')+' km · '+Math.round(q[1])+' m';dot?dot.setLatLng([q[2],q[3]]):dot=L.circleMarker([q[2],q[3]],{radius:7,color:"#fff",weight:2,fillColor:"#111",fillOpacity:1}).addTo(map)}}addEventListener("resize",draw);draw();
</script></body></html>
