name: Aktualizace webu

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Stahnout repozitar
        uses: actions/checkout@v4

      - name: Aktualizovat web
        env:
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
        run: python3 build_site.py

      - name: Ulozit zmeny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archiv.html generated-routes.js
          git add -- '*/media.js'
          git add -- '*/detail.html'
          if git diff --cached --quiet; then
            echo "Web je aktualni."
            exit 0
          fi
          git commit -m "Automaticka aktualizace webu"
          git push
