<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Běžky — Kocourovy cesty</title>
<style>
:root{--bg:#f5f3ee;--text:#111;--muted:#777;--line:#d9d5cc;--card:#ebe7df}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;padding:28px 42px;border-bottom:1px solid var(--line)}
.brand{font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
nav{font-size:13px;text-transform:uppercase;letter-spacing:.08em}
main{max-width:1400px;margin:auto;padding:42px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:30px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.hero h1{margin:0;font-size:42px;line-height:1.03}
.hero .date{font-size:13px;color:var(--muted);letter-spacing:.1em;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:28px}
.stat{background:var(--bg);padding:22px 18px}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:7px}
.stat-value{font-size:24px;font-weight:700}
.section{margin-top:52px}
.section h2{margin:0 0 18px;font-size:14px;text-transform:uppercase;letter-spacing:.12em}

/* MEDIA — stejné pořadí jako u ostatních aktivit */
.media-tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.media-tile{border:1px solid var(--line);background:var(--card);min-height:180px;padding:22px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s ease,border-color .15s ease;user-select:none}
.media-tile:hover{transform:translateY(-2px);border-color:#aaa49a}
.media-tile-title{font-size:24px;font-weight:700}
.media-tile-meta{margin-top:6px;color:var(--muted);font-size:12px}
.media-tile-action{margin-top:12px;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.media-panel{display:none;margin-top:16px}
.media-panel.open{display:block}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.photo-card{display:block;background:var(--card);overflow:hidden}
.photo-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.video-card{background:var(--card);border:1px solid var(--line);padding:12px}
.video-card video{display:block;width:100%;max-height:520px;background:#111}
.empty{color:var(--muted);font-size:13px;padding:12px 0}
.map-frame{display:block;width:100%;height:690px;border:1px solid var(--line);background:#fff}

@media(max-width:900px){
  header{padding:20px}
  main{padding:24px 20px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .gallery,.video-grid{grid-template-columns:repeat(2,1fr)}
  .map-frame{height:610px}
}
@media(max-width:600px){
  .hero{display:block}.hero .date{margin-top:12px}
  .hero h1{font-size:34px}
  .media-tiles{grid-template-columns:1fr}
  .gallery,.video-grid{grid-template-columns:1fr}
  .map-frame{height:540px}
}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">Kocourovy cesty</a>
  <nav><a href="/archiv.html">Archiv</a></nav>
</header>

<main>
  <section class="hero">
    <h1>Běžky</h1>
    <div class="date">23. 2. 2026 · Horská Kvilda</div>
  </section>

  <!-- 1. SHRNUTÍ -->
  <section>
    <div class="stats">
      <div class="stat"><div class="stat-value">23,38 km</div><div class="stat-label">Vzdálenost</div></div>
      <div class="stat"><div class="stat-value">4:07:19</div><div class="stat-label">Čas aktivity</div></div>
      <div class="stat"><div class="stat-value">↑ 554 m</div><div class="stat-label">Nahoru</div></div>
      <div class="stat"><div class="stat-value">↓ 536 m</div><div class="stat-label">Dolů</div></div>
      <div class="stat"><div class="stat-value">2 063 kcal</div><div class="stat-label">Kalorie</div></div>
      <div class="stat"><div class="stat-value">2,55 l</div><div class="stat-label">Pocení</div></div>
      <div class="stat"><div class="stat-value">138 bpm</div><div class="stat-label">Ø tep</div></div>
      <div class="stat"><div class="stat-value">182 bpm</div><div class="stat-label">Max. tep</div></div>
    </div>
  </section>

  <!-- 2. FOTKY A VIDEA -->
  <section class="section">
    <h2>Média</h2>
    <div class="media-tiles">
      <div class="media-tile" id="photosTile">
        <div class="media-tile-title">Fotky</div>
        <div class="media-tile-meta"><span id="photoCount">0</span> položek</div>
        <div class="media-tile-action">Rozbalit ↓</div>
      </div>
      <div class="media-tile" id="videosTile">
        <div class="media-tile-title">Videa</div>
        <div class="media-tile-meta"><span id="videoCount">0</span> položek</div>
        <div class="media-tile-action">Rozbalit ↓</div>
      </div>
    </div>

    <div class="media-panel" id="photosPanel"><div class="gallery" id="gallery"></div></div>
    <div class="media-panel" id="videosPanel"><div class="video-grid" id="videoGrid"></div></div>
  </section>

  <!-- 3. MAPA + PROFIL -->
  <section class="section">
    <h2>Mapa a výškový profil</h2>
    <iframe class="map-frame" src="mapa.html" loading="lazy" title="Mapa a výškový profil — Běžky"></iframe>
  </section>
</main>

<script src="media.js"></script>
<script>
const PHOTO_BASE="https://cesty.b-cdn.net/2026_02_Kvilda/FOTO/";
const VIDEO_BASE="https://cesty.b-cdn.net/2026_02_Kvilda/VIDEO/";
const photos=window.MEDIA_PHOTOS||[];
const videos=window.MEDIA_VIDEOS||[];

document.getElementById("photoCount").textContent=photos.length;
document.getElementById("videoCount").textContent=videos.length;

let photosBuilt=false;
let videosBuilt=false;

function buildPhotos(){
  if(photosBuilt)return; photosBuilt=true;
  const g=document.getElementById("gallery");
  if(!photos.length){g.innerHTML='<div class="empty">Žádné fotky.</div>';return}
  const frag=document.createDocumentFragment();
  photos.forEach(name=>{
    const a=document.createElement("a");
    a.className="photo-card";
    a.href=PHOTO_BASE+encodeURIComponent(name);
    a.target="_blank"; a.rel="noopener";
    const img=document.createElement("img");
    img.loading="lazy";
    img.alt=name;
    img.src=PHOTO_BASE+encodeURIComponent(name);
    a.appendChild(img); frag.appendChild(a);
  });
  g.appendChild(frag);
}
function buildVideos(){
  if(videosBuilt)return; videosBuilt=true;
  const g=document.getElementById("videoGrid");
  if(!videos.length){g.innerHTML='<div class="empty">Žádná videa.</div>';return}
  videos.forEach(name=>{
    const card=document.createElement("div"); card.className="video-card";
    const v=document.createElement("video"); v.controls=true; v.preload="none";
    const s=document.createElement("source"); s.src=VIDEO_BASE+encodeURIComponent(name);
    v.appendChild(s); card.appendChild(v); g.appendChild(card);
  });
}
function toggle(panel,tile,builder){
  const p=document.getElementById(panel);
  const open=!p.classList.contains("open");
  p.classList.toggle("open",open);
  document.querySelector("#"+tile+" .media-tile-action").textContent=open?"Sbalit ↑":"Rozbalit ↓";
  if(open)builder();
}
document.getElementById("photosTile").onclick=()=>toggle("photosPanel","photosTile",buildPhotos);
document.getElementById("videosTile").onclick=()=>toggle("videosPanel","videosTile",buildVideos);
</script>










<!-- FLOATING-MEDIA-CLOSE:START -->
<style>
#floatingMediaClose{
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:99999;
  display:none;
  align-items:center;
  gap:8px;
  border:1px solid #111;
  background:#111;
  color:#f5f3ee;
  padding:12px 16px;
  font:700 11px Arial,Helvetica,sans-serif;
  letter-spacing:.09em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,.18);
}
#floatingMediaClose.visible{display:flex}
#floatingMediaClose:hover{background:#f5f3ee;color:#111}
@media(max-width:600px){
  #floatingMediaClose{
    right:14px;
    bottom:14px;
    padding:11px 14px;
  }
}
</style>

<button id="floatingMediaClose" type="button" aria-label="Sbalit otevřená média">
  ↑ Sbalit
</button>

<script>
(()=>{
  const btn=document.getElementById('floatingMediaClose');
  if(!btn)return;

  function state(){
    const photos=document.getElementById('photosPanel');
    const videos=document.getElementById('videosPanel');

    if(photos && photos.classList.contains('open')){
      return {
        panel:photos,
        tile:document.getElementById('photosTile')
      };
    }

    if(videos && videos.classList.contains('open')){
      return {
        panel:videos,
        tile:document.getElementById('videosTile')
      };
    }

    const generic=document.querySelector('.media-panel.open');
    if(generic){
      return {
        panel:generic,
        tile:null
      };
    }

    return null;
  }

  function refresh(){
    btn.classList.toggle('visible',!!state());
  }

  btn.addEventListener('click',()=>{
    const s=state();
    if(!s)return;

    const target=s.tile || s.panel;

    // Kdyz existuje puvodni dlazdice Fotky/Videa,
    // pouzijeme jeji vlastni click handler, aby vse zustalo synchronizovane.
    if(s.tile){
      s.tile.click();
    }else{
      s.panel.classList.remove('open');
    }

    btn.classList.remove('visible');

    setTimeout(()=>{
      target.scrollIntoView({
        behavior:'smooth',
        block:'center'
      });
    },40);
  });

  // Sleduje rozbaleni/sbaleni bez ohledu na to, jaky detail ho provedl.
  const observer=new MutationObserver(refresh);
  observer.observe(document.body,{
    subtree:true,
    attributes:true,
    attributeFilter:['class']
  });

  document.addEventListener('click',()=>setTimeout(refresh,0));
  refresh();
})();
</script>
<!-- FLOATING-MEDIA-CLOSE:END -->

</body>
</html>
