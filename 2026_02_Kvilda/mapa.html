<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa — Běžky</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}#w{height:100%;display:flex;flex-direction:column}#map{flex:1;min-height:300px}#p{height:190px;border-top:1px solid #d9d5cc;background:#fff;position:relative}svg{width:100%;height:100%;display:block}.tip{position:absolute;top:8px;left:12px;background:#fff;padding:5px 8px;font-size:12px;border:1px solid #ddd;pointer-events:none}@media(max-width:700px){#p{height:165px}}</style></head>
<body><div id="w"><div id="map"></div><div id="p"><svg id="svg"></svg><div class="tip" id="tip">Přejeď po profilu</div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="data/profile_data.js"></script><script>
const P=window.PROFILE_DATA||[],map=L.map("map");L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
if(P.length){const l=L.polyline(P.map(x=>[x[2],x[3]]),{color:"#111",weight:4,opacity:.9}).addTo(map);map.fitBounds(l.getBounds(),{padding:[20,20]})}
const s=document.getElementById("svg"),t=document.getElementById("tip");let m;
function draw(){if(!P.length){t.textContent="Profil není k dispozici";return}const w=s.clientWidth,h=s.clientHeight,a=18,D=P.at(-1)[0],es=P.map(x=>x[1]),mn=Math.min(...es),mx=Math.max(...es),X=d=>a+d/D*(w-2*a),Y=e=>h-a-(e-mn)/Math.max(1,mx-mn)*(h-2*a);s.innerHTML='<path d="'+P.map((q,i)=>(i?"L":"M")+X(q[0])+" "+Y(q[1])).join(" ")+'" fill="none" stroke="#111" stroke-width="2"/>';s.onpointermove=e=>{const r=s.getBoundingClientRect();let d=Math.max(0,Math.min(D,(e.clientX-r.left-a)/(w-2*a)*D)),lo=0,hi=P.length-1;while(lo<hi){let z=(lo+hi)>>1;P[z][0]<d?lo=z+1:hi=z}const q=P[lo];t.textContent=q[0].toFixed(1).replace(".",",")+" km · "+Math.round(q[1])+" m";m?m.setLatLng([q[2],q[3]]):m=L.circleMarker([q[2],q[3]],{radius:7,color:"#fff",weight:2,fillColor:"#111",fillOpacity:1}).addTo(map)}}addEventListener("resize",draw);draw();
</script></body></html>
