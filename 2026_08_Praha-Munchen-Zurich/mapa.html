<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa — Praha – Mnichov – Curych</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
  width:100%;
  height:100%;
  margin:0;
}
html,body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}
#map{
  position:absolute;
  inset:0;
}
.leaflet-popup-content{
  margin:12px 14px;
  min-width:220px;
}
.media-popup img{
  display:block;
  width:100%;
  max-width:520px;
  height:auto;
  border-radius:3px;
}
.media-popup video{
  display:block;
  width:100%;
  max-width:520px;
  max-height:520px;
  background:#000;
}
.media-name{
  margin-top:7px;
  font-size:12px;
  color:#555;
  word-break:break-word;
}
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- DATA Z TVÉHO QGIS2WEB EXPORTU -->
<script src="data/tracks_1.js"></script>
<script src="data/tracks_2.js"></script>
<script src="data/tracks_3.js"></script>
<script src="data/tracks_4.js"></script>
<script src="data/tracks_5.js"></script>
<script src="data/tracks_6.js"></script>
<script src="data/tracks_7.js"></script>
<script src="data/tracks_8.js"></script>
<script src="data/tracks_9.js"></script>
<script src="data/tracks_10.js"></script>
<script src="data/tracks_11.js"></script>

<script src="data/Videa_12.js"></script>
<script src="data/Fotky_13.js"></script>
<script src="data/Fotky_podle_casu_14.js"></script>

<script>
const PHOTO_BASE = "https://cesty.b-cdn.net/2026_08_Praha-Munich-Zurich/FOTO/";
const VIDEO_BASE = "https://cesty.b-cdn.net/2026_08_Praha-Munich-Zurich/VIDEO/";

const map = L.map("map", {
  zoomControl: true
});

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const allBounds = L.latLngBounds();

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function basename(path){
  if(!path) return "";
  return String(path).replaceAll("\\","/").split("/").pop();
}

function fileFromProperties(props){
  props = props || {};

  // U GPS fotek bývá kompletní název v "photo".
  let f = basename(props.photo || props.path || props.file || "");

  // U ostatních vrstev může být jen filename.
  if(!f) f = basename(props.filename || props.name || "");

  return f;
}

function ensurePhotoExtension(name){
  if(!name) return "";
  if(/\.(jpg|jpeg|png|webp|gif|heic)$/i.test(name)) return name;
  return name + ".jpg";
}

function photoPopup(feature){
  const p = feature.properties || {};

  // Nově používáme rovnou přesnou URL uloženou v mapových datech.
  if(p.photo_url){
    const url = String(p.photo_url);
    const name = p.bunny_file || fileFromProperties(p) || "Fotka";
    return `
      <div class="media-popup">
        <a href="${url}" target="_blank" rel="noopener">
          <img src="${url}" alt="${escapeHtml(name)}">
        </a>
        <div class="media-name">${escapeHtml(name)}</div>
      </div>`;
  }

  // Záloha pro starší data.
  let file = fileFromProperties(p);
  if(!file) return "Fotka";

  const url = PHOTO_BASE + encodeURIComponent(file);

  return `
    <div class="media-popup">
      <a href="${url}" target="_blank" rel="noopener">
        <img src="${url}" alt="${escapeHtml(file)}">
      </a>
      <div class="media-name">${escapeHtml(file)}</div>
    </div>`;
}

function gpsPhotoPopup(feature){
  const p = feature.properties || {};

  if(p.photo_url){
    const url = String(p.photo_url);
    const name = p.bunny_file || p.photo || "Fotka";
    return `
      <div class="media-popup">
        <a href="${url}" target="_blank" rel="noopener">
          <img src="${url}" alt="${escapeHtml(name)}">
        </a>
        <div class="media-name">${escapeHtml(name)}</div>
      </div>`;
  }

  // Záloha pro starší export.
  const rawPhoto = String(p.photo || "");
  if(!rawPhoto) return "Fotka";

  const bunnyName = rawPhoto.replace(/[\\/:]/g, "_").trim();
  const url = PHOTO_BASE + encodeURIComponent(bunnyName);

  return `
    <div class="media-popup">
      <a href="${url}" target="_blank" rel="noopener">
        <img src="${url}" alt="${escapeHtml(bunnyName)}">
      </a>
      <div class="media-name">${escapeHtml(bunnyName)}</div>
    </div>`;
}

function videoPopup(feature){
  const p = feature.properties || {};
  let file = p.bunny_file || fileFromProperties(p);
  if(!file) return "Video";

  const url = p.video_url || (VIDEO_BASE + encodeURIComponent(file));

  return `
    <div class="media-popup">
      <video controls preload="metadata">
        <source src="${url}">
        Prohlížeč toto video nepodporuje.
      </video>
      <div class="media-name">${escapeHtml(file)}</div>
    </div>`;
}

function addGeoJson(data, options){
  if(!data || !data.type) return;

  const layer = L.geoJSON(data, options).addTo(map);

  try{
    const b = layer.getBounds();
    if(b && b.isValid()) allBounds.extend(b);
  }catch(e){}
}

function findGeoJsonGlobals(){
  const found = [];

  for(const key of Object.keys(window)){
    let value;
    try{ value = window[key]; }catch(e){ continue; }

    if(value &&
       typeof value === "object" &&
       (value.type === "FeatureCollection" || value.type === "Feature")){
      found.push({key, value});
    }
  }

  return found;
}

const datasets = findGeoJsonGlobals();

datasets.forEach(({key, value}) => {
  const k = key.toLowerCase();

  if(k.includes("fotky_podle_casu")){
    addGeoJson(value, {
      pointToLayer: (feature, latlng) =>
        L.circleMarker(latlng,{
          radius:6,
          color:"#fff",
          weight:1.5,
          fillColor:"#111",
          fillOpacity:1
        }),
      onEachFeature: (feature, layer) =>
        layer.bindPopup(photoPopup(feature), {maxWidth:560})
    });
    return;
  }

  if(k.includes("fotky")){
    addGeoJson(value, {
      pointToLayer: (feature, latlng) =>
        L.circleMarker(latlng,{
          radius:6,
          color:"#fff",
          weight:1.5,
          fillColor:"#111",
          fillOpacity:1
        }),
      onEachFeature: (feature, layer) =>
        layer.bindPopup(gpsPhotoPopup(feature), {maxWidth:560})
    });
    return;
  }

  if(k.includes("videa")){
    addGeoJson(value, {
      pointToLayer: (feature, latlng) =>
        L.circleMarker(latlng,{
          radius:7,
          color:"#fff",
          weight:2,
          fillColor:"#111",
          fillOpacity:1
        }),
      onEachFeature: (feature, layer) =>
        layer.bindPopup(videoPopup(feature), {maxWidth:560})
    });
    return;
  }

  if(k.includes("track")){
    addGeoJson(value, {
      style:{
        color:"#111",
        weight:4,
        opacity:.9
      }
    });
  }
});

if(allBounds.isValid()){
  map.fitBounds(allBounds, {padding:[25,25]});
}else{
  map.setView([47.3, 9.5], 7);
}
</script>

</body>
</html>
