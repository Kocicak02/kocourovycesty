<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa — Lyžování</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif}
#wrap{height:100%;display:flex;flex-direction:column}
#map{flex:1;min-height:320px;background:#eee}
#profile{height:190px;border-top:1px solid #d9d5cc;background:#fff;position:relative}
#profile svg{width:100%;height:100%;display:block}
.tip{position:absolute;left:12px;top:8px;padding:5px 8px;background:#fff;border:1px solid #ddd;font-size:12px;pointer-events:none}
.leaflet-popup-content img{display:block;max-width:280px;max-height:300px}
@media(max-width:700px){#profile{height:165px}}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="profile">
    <svg id="profileSvg"></svg>
    <div class="tip" id="tip">Přejeď po profilu</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/track_1.js"></script>
<script src="data/Fotky_2.js"></script>
<script src="data/Fotky_podle_casu_3.js"></script>
<script src="data/Videa_4.js"></script>
<script src="data/profile_data.js"></script>

<script>
const BUNNY = "https://cesty.b-cdn.net/2025_12_Dolomity/";
const map = L.map("map");

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

// Trasa přímo z qgis2web vrstvy.
const routeLayer = L.geoJSON(json_track_1, {
  style: {color:"#111", weight:4, opacity:.9}
}).addTo(map);

if (routeLayer.getBounds().isValid()) {
  map.fitBounds(routeLayer.getBounds(), {padding:[20,20]});
} else {
  map.setView([46.47, 11.75], 11);
}

function photoUrl(p) {
  if (p.photo_url && p.photo_url.startsWith("https://")) return p.photo_url;
  if (p.bunny_file) return BUNNY + "FOTO/" + encodeURIComponent(p.bunny_file);
  if (p.filename) return BUNNY + "FOTO/" + encodeURIComponent(p.filename);
  return "";
}

function addPhotoLayer(data) {
  if (!data || !data.features) return;
  L.geoJSON(data, {
    pointToLayer: (f, latlng) => L.circleMarker(latlng, {
      radius:5, color:"#111", weight:2, fillColor:"#fff", fillOpacity:1
    }),
    onEachFeature: (f, layer) => {
      const p = f.properties || {};
      const url = photoUrl(p);
      if (!url) return;
      const name = p.filename || p.bunny_file || "";
      layer.bindPopup(
        '<a href="' + url + '" target="_blank" rel="noopener">' +
        '<img src="' + url + '" alt="' + name.replace(/"/g,"&quot;") + '">' +
        '</a>'
      );
    }
  }).addTo(map);
}

// Fotky s GPS + fotky dopočítané podle času.
addPhotoLayer(json_Fotky_2);
addPhotoLayer(json_Fotky_podle_casu_3);

// Výškový profil.
const P = window.PROFILE_DATA || [];
const BREAKS = window.ACTIVITY_BREAKS || [];
const svg = document.getElementById("profileSvg");
const tip = document.getElementById("tip");
let dot = null;

function drawProfile() {
  if (!P.length) {
    tip.textContent = "Profil není k dispozici";
    return;
  }

  const w = svg.clientWidth;
  const h = svg.clientHeight;
  const pad = 18;
  const maxD = P[P.length - 1][0];
  const elevations = P.map(p => p[1]);
  const minE = Math.min(...elevations);
  const maxE = Math.max(...elevations);

  const X = d => pad + (d / maxD) * (w - 2*pad);
  const Y = e => h - pad - ((e - minE) / Math.max(1, maxE-minE)) * (h - 2*pad);

  const path = P.map((p,i) =>
    (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)
  ).join(" ");

  svg.innerHTML = '<path d="' + path + '" fill="none" stroke="#111" stroke-width="2"/>';

  BREAKS.forEach(b => {
    const x = X(b);
    svg.innerHTML += '<line x1="'+x+'" y1="8" x2="'+x+'" y2="'+(h-8)+'" stroke="#999" stroke-dasharray="4 4"/>';
  });

  function move(e) {
    const r = svg.getBoundingClientRect();
    let d = ((e.clientX - r.left - pad) / (w - 2*pad)) * maxD;
    d = Math.max(0, Math.min(maxD, d));

    let lo=0, hi=P.length-1;
    while(lo<hi){
      const m=(lo+hi)>>1;
      if(P[m][0] < d) lo=m+1; else hi=m;
    }

    const p=P[lo];
    tip.textContent = p[0].toFixed(1).replace(".",",") + " km · " + Math.round(p[1]) + " m";

    if (!dot) {
      dot = L.circleMarker([p[2],p[3]], {
        radius:7, color:"#fff", weight:2, fillColor:"#111", fillOpacity:1
      }).addTo(map);
    } else {
      dot.setLatLng([p[2],p[3]]);
    }
  }

  svg.onpointermove = move;
}

window.addEventListener("resize", drawProfile);
drawProfile();
</script>
</body>
</html>
