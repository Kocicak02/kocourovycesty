<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa — Lyžování</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f3ee;color:#111;font-family:Arial,Helvetica,sans-serif}
#map{height:430px;background:#eee}
.profiles{background:#fff;border:1px solid #d9d5cc;border-top:0}
.profile-block{border-top:1px solid #d9d5cc}
.profile-title{padding:10px 14px 4px;font-size:12px;font-weight:700}
.profile{height:150px;position:relative}
.profile svg{width:100%;height:100%;display:block}
.tip{position:absolute;left:12px;top:6px;padding:4px 7px;background:#fff;border:1px solid #ddd;font-size:11px;pointer-events:none}
@media(max-width:700px){
  #map{height:350px}
  .profile{height:135px}
}
</style>
</head>
<body>

<div id="map"></div>

<div class="profiles">
  <div class="profile-block">
    <div class="profile-title">19. 12. 2025</div>
    <div class="profile">
      <svg id="svg0"></svg>
      <div class="tip" id="tip0">Přejeď po profilu</div>
    </div>
  </div>

  <div class="profile-block">
    <div class="profile-title">20. 12. 2025</div>
    <div class="profile">
      <svg id="svg1"></svg>
      <div class="tip" id="tip1">Přejeď po profilu</div>
    </div>
  </div>

  <div class="profile-block">
    <div class="profile-title">21. 12. 2025</div>
    <div class="profile">
      <svg id="svg2"></svg>
      <div class="tip" id="tip2">Přejeď po profilu</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/track_1.js"></script>
<script src="data/Fotky_2.js"></script>
<script src="data/Fotky_podle_casu_3.js"></script>
<script src="data/Videa_4.js"></script>
<script src="data/profile_segments.js"></script>

<script>
const BUNNY = "https://cesty.b-cdn.net/2025_12_Dolomity/";
const map = L.map("map");

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19,
  attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

const routeLayer = L.geoJSON(json_track_1, {
  style:{color:"#111",weight:4,opacity:.9}
}).addTo(map);

if(routeLayer.getBounds().isValid()){
  map.fitBounds(routeLayer.getBounds(),{padding:[20,20]});
}

function photoUrl(p){
  if(p.photo_url && p.photo_url.startsWith("https://")) return p.photo_url;
  if(p.bunny_file) return BUNNY + "FOTO/" + encodeURIComponent(p.bunny_file);
  if(p.filename) return BUNNY + "FOTO/" + encodeURIComponent(p.filename);
  return "";
}

function addPhotoLayer(data){
  if(!data || !data.features) return;
  L.geoJSON(data,{
    pointToLayer:(f,ll)=>L.circleMarker(ll,{
      radius:5,color:"#111",weight:2,fillColor:"#fff",fillOpacity:1
    }),
    onEachFeature:(f,l)=>{
      const p=f.properties||{};
      const url=photoUrl(p);
      if(!url) return;
      l.bindPopup('<img src="'+url+'" style="max-width:280px;max-height:300px">');
    }
  }).addTo(map);
}

addPhotoLayer(json_Fotky_2);
addPhotoLayer(json_Fotky_podle_casu_3);

const SEGMENTS = window.PROFILE_SEGMENTS || [];
let dots = [null,null,null];

function drawProfile(i){
  const P=SEGMENTS[i]||[];
  if(!P.length) return;

  const svg=document.getElementById("svg"+i);
  const tip=document.getElementById("tip"+i);
  const w=svg.clientWidth,h=svg.clientHeight,pad=18;
  const maxD=P[P.length-1][0];
  const es=P.map(x=>x[1]);
  const mn=Math.min(...es),mx=Math.max(...es);

  const X=d=>pad+(d/maxD)*(w-2*pad);
  const Y=e=>h-pad-((e-mn)/Math.max(1,mx-mn))*(h-2*pad);

  const path=P.map((p,j)=>(j?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  svg.innerHTML='<path d="'+path+'" fill="none" stroke="#111" stroke-width="2"/>';

  svg.onpointermove=e=>{
    const r=svg.getBoundingClientRect();
    let d=((e.clientX-r.left-pad)/(w-2*pad))*maxD;
    d=Math.max(0,Math.min(maxD,d));

    let lo=0,hi=P.length-1;
    while(lo<hi){
      const m=(lo+hi)>>1;
      if(P[m][0]<d) lo=m+1;
      else hi=m;
    }

    const p=P[lo];
    tip.textContent=p[0].toFixed(1).replace(".",",")+" km · "+Math.round(p[1])+" m";

    if(!dots[i]){
      dots[i]=L.circleMarker([p[2],p[3]],{
        radius:7,color:"#fff",weight:2,fillColor:"#111",fillOpacity:1
      }).addTo(map);
    }else{
      dots[i].setLatLng([p[2],p[3]]);
    }
  };
}

function drawAll(){
  drawProfile(0);
  drawProfile(1);
  drawProfile(2);
}

window.addEventListener("resize",drawAll);
drawAll();
</script>
</body>
</html>
