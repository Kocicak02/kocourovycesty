<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa — Dolomity 2026</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
  width:100%;
  height:100%;
  margin:0;
}
html,body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}
#map{
  position:absolute;
  inset:0;
}
.leaflet-popup-content{
  margin:12px 14px;
  min-width:220px;
}
.media-popup img{
  display:block;
  width:100%;
  max-width:520px;
  height:auto;
  border-radius:3px;
}
.media-name{
  margin-top:7px;
  font-size:12px;
  color:#555;
  word-break:break-word;
}
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="data/track_1.js"></script>
<script src="data/Fotky_podle_casu_2.js"></script>

<script>
const PHOTO_BASE =
  "https://cesty.b-cdn.net/2026_07_Dolomity/FOTO/";

const map = L.map("map", {
  zoomControl:true
});

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom:19,
  attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

const allBounds = L.latLngBounds();

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function photoFilename(props){
  if(!props) return "";

  if(props.filename){
    return String(props.filename).trim();
  }

  const raw = props.path || "";
  if(!raw) return "";

  return String(raw).split(/[\\/]/).pop().trim();
}

function photoUrl(props){
  const file = photoFilename(props);
  if(!file) return "";

  return PHOTO_BASE + encodeURIComponent(file);
}

if(typeof json_track_1 !== "undefined"){
  const trackLayer = L.geoJSON(json_track_1,{
    style:{
      color:"#111",
      weight:4,
      opacity:.9
    }
  }).addTo(map);

  const b = trackLayer.getBounds();
  if(b.isValid()) allBounds.extend(b);
}

if(typeof json_Fotky_podle_casu_2 !== "undefined"){
  const photoLayer = L.geoJSON(json_Fotky_podle_casu_2,{
    pointToLayer:(feature,latlng)=>
      L.circleMarker(latlng,{
        radius:6,
        color:"#fff",
        weight:1.5,
        fillColor:"#111",
        fillOpacity:1
      }),

    onEachFeature:(feature,layer)=>{
      const p = feature.properties || {};
      const file = photoFilename(p);
      const url = photoUrl(p);

      if(!url) return;

      layer.bindPopup(`
        <div class="media-popup">
          <a href="${url}" target="_blank" rel="noopener">
            <img src="${url}" alt="${esc(file)}">
          </a>
          <div class="media-name">${esc(file)}</div>
        </div>
      `,{maxWidth:560});
    }
  }).addTo(map);

  const b = photoLayer.getBounds();
  if(b.isValid()) allBounds.extend(b);
}

if(allBounds.isValid()){
  map.fitBounds(allBounds,{padding:[25,25]});
}else{
  map.setView([46.55,11.85],10);
}
</script>

</body>
</html>
