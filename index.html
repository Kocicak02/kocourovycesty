<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kocourovy cesty</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#f4f1ea;color:#111;font-family:Arial,Helvetica,sans-serif}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(1500px,calc(100% - 32px));margin:auto}
    header{display:flex;justify-content:space-between;align-items:center;padding:24px 0 18px;border-bottom:1px solid #c9c3b8;position:sticky;top:0;background:rgba(244,241,234,.96);backdrop-filter:blur(8px);z-index:20}
    .brand{font-size:20px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
    nav{display:flex;gap:24px}
    nav a{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    main{padding:28px 0 56px}
    .hero-card,.small-card{position:relative;overflow:hidden;background:#ddd}
    .hero-card{height:min(72vh,820px);min-height:500px}
    .hero-card img,.small-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
    .hero-card:hover img,.small-card:hover img{transform:scale(1.015)}
    .overlay{position:absolute;inset:auto 0 0 0;padding:28px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff}
    .title{font-size:clamp(34px,5vw,72px);font-weight:900;letter-spacing:-.04em;text-transform:uppercase;line-height:.95}
    .meta{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.88}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
    .small-card{aspect-ratio:16/10}
    .small-card .title{font-size:clamp(24px,3vw,42px)}
    .archive{display:flex;justify-content:space-between;align-items:center;margin-top:36px;padding:22px 0;border-top:1px solid #c9c3b8;border-bottom:1px solid #c9c3b8;text-transform:uppercase;font-weight:900;letter-spacing:.04em;font-size:clamp(28px,4vw,54px)}
    footer{padding:28px 0 40px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6e6a62}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.hero-card{min-height:420px;height:62vh}.wrap{width:min(100% - 20px,1500px)}header{padding-top:18px}.brand{font-size:17px}nav{gap:14px}.overlay{padding:20px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="#">Kocourovy cesty</a>
      <nav>
        <a href="#aktivity">Aktivity</a>
        <a href="archiv/">Archiv</a>
      </nav>
    </header>

    <main id="aktivity">
      <a class="hero-card" href="svycarsko-2026/">
        <img src="https://cesty.b-cdn.net/C__Users_kocka_Desktop_vse_IMG_2167(1).jpg" alt="Švýcarsko 2026">
        <div class="overlay">
          <div class="title">Švýcarsko 2026</div>
          <div class="meta">Kolo · srpen 2026</div>
        </div>
      </a>

      <div class="grid">
        <a class="small-card" href="#">
          <img src="https://images.unsplash.com/photo-1551698618-1dfe5d97d256?auto=format&fit=crop&w=1600&q=85" alt="Čertovský ultratrail">
          <div class="overlay">
            <div class="title">Čertovský ultratrail</div>
            <div class="meta">Běh · červen 2026</div>
          </div>
        </a>

        <a class="small-card" href="#">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85" alt="Další aktivita">
          <div class="overlay">
            <div class="title">Další aktivita</div>
            <div class="meta">2026</div>
          </div>
        </a>
      </div>

      <a class="archive" href="archiv/">
        <span>Archiv</span>
        <span>→</span>
      </a>
    </main>

    <footer>Kocourovy cesty</footer>
  </div>
</body>
</html>
