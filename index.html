<!doctype html>
<html lang="cs">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Kocourovy cesty</title>


<style>

:root{
  --bg:#f5f3ee;
  --text:#111;
  --muted:#777;
  --line:#d9d5cc;
  --card:#ebe7df;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:28px 42px;
  border-bottom:1px solid var(--line);
}

.brand{
  font-size:18px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}

nav{
  display:flex;
  gap:24px;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

main{
  max-width:1400px;
  margin:auto;
  padding:42px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:18px;
}

.head h1{
  margin:0;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.12em;
}

.head span{
  font-size:12px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card{
  display:flex;
  flex-direction:column;
  min-height:390px;
  background:var(--card);
  overflow:hidden;
  transition:transform .18s ease;
}

.card:hover{
  transform:translateY(-3px);
}

.card-image{
  width:100%;
  height:250px;
  object-fit:contain;
  display:block;
}

.card-content{
  display:flex;
  flex:1;
  flex-direction:column;
  padding:22px;
}

.card-type{
  margin-bottom:8px;
  font-size:10px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.1em;
}

.card-title{
  font-size:24px;
  font-weight:700;
  line-height:1.08;
}

.card-bottom{
  margin-top:auto;
  padding-top:24px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.archive-link{
  margin-top:30px;
  border-top:1px solid var(--line);
  padding-top:20px;
  display:flex;
  justify-content:flex-end;
}

.archive-link a{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.1em;
}

footer{
  max-width:1400px;
  margin:auto;
  padding:34px 42px 50px;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

@media(max-width:900px){

  header{
    padding:20px;
  }

  main{
    padding:24px 20px;
  }

  .grid{
    grid-template-columns:1fr;
  }

}

</style>


</head>


<body>


<header>

  <a
    class="brand"
    href="/"
  >
    Kocourovy cesty
  </a>

  <nav>

    <a href="/archiv.html">
      Archiv
    </a>

  </nav>

</header>


<main>

  <div class="head">

    <h1>
      Posledni aktivity
    </h1>

    <span>
      3 nejnovější
    </span>

  </div>


  <div class="grid">

    
        <a
          class="card"
          href="/2026_08_Praha-Munchen-Zurich/detail.html"
        >

          <img class="card-image" src="/images/kolo.png" alt="">

          <div class="card-content">

            <div class="card-type">Cyklistika</div>

            <div class="card-title">
              Praha – Mnichov – Curych
            </div>

            <div class="card-bottom">

              <span>
                08 / 2026
              </span>

              <span>
                Otevrit →
              </span>

            </div>

          </div>

        </a>
        

        <a
          class="card"
          href="/2026_07_Dolomity/detail.html"
        >

          <img class="card-image" src="/images/tura.png" alt="">

          <div class="card-content">

            <div class="card-type">Tůra</div>

            <div class="card-title">
              Dolomity
            </div>

            <div class="card-bottom">

              <span>
                07 / 2026
              </span>

              <span>
                Otevrit →
              </span>

            </div>

          </div>

        </a>
        

        <a
          class="card"
          href="/2026_06_Certovskej_ultratrail/detail.html"
        >

          <img class="card-image" src="/images/beh.png" alt="">

          <div class="card-content">

            <div class="card-type">Běh</div>

            <div class="card-title">
              Čertovskej ultratrail 2026
            </div>

            <div class="card-bottom">

              <span>
                06 / 2026
              </span>

              <span>
                Otevrit →
              </span>

            </div>

          </div>

        </a>
        

  </div>


  <div class="archive-link">

    <a href="/archiv.html">
      Archiv →
    </a>

  </div>

</main>


<footer>
  Kocourovy cesty
</footer>


</body>

</html>
